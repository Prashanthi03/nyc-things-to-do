<script>
/* ==LOGIC-START== */
// Pure, DOM-free logic. The test harness extracts everything between the
// LOGIC markers and runs it under Node. Keep this block free of DOM/window
// references so it loads cleanly outside a browser.
function ping() { return 'pong'; }

// Canonical match key: "<category>::<normalized name>". Lowercase, strip
// punctuation, collapse whitespace. Used for all dedup (add time and load).
function normalizeKey(category, name) {
  const n = String(name)
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return category + '::' + n;
}

// Non-guessable id for user-added items, NEVER derived from the name, so it
// cannot collide with a hand-authored seed slug.
function makeCustomId() {
  const rand = (Math.random().toString(36).slice(2) + '000000').slice(0, 6);
  return 'c_' + Date.now() + '_' + rand;
}

// Add a user item to a category only if its normalized key isn't already in
// the live catalog (seed ∪ custom). moods is always stored as an array.
function addCustomItem(customItems, input, seed) {
  const live = (seed || []).concat(customItems || []);
  const key = normalizeKey(input.category, input.name);
  if (live.some(function (it) { return normalizeKey(it.category, it.name) === key; })) {
    return { ok: false, reason: 'duplicate' };
  }
  const moods = Array.isArray(input.moods)
    ? input.moods.slice()
    : (input.mood ? [input.mood] : []);
  const item = {
    id: makeCustomId(),
    name: String(input.name).trim(),
    category: input.category,
    emoji: input.emoji || '📍',
    area: input.area || '',
    budget: input.budget || '$$',
    moods: moods,
    time: input.time || 'half',
    blurb: input.blurb || '',
    custom: true,
  };
  return { ok: true, item };
}

var CURRENT_SCHEMA = 1;

// Reconcile stored per-person state against the live catalog on every load:
// apply id renames, merge custom items that now match a seed (seed wins, mark
// migrates), drop orphaned ids, and de-dup. Keeps progress and Plan honest.
function reconcile(state, seed, renameMap) {
  renameMap = renameMap || {};
  seed = seed || [];
  var customItems = (state && Array.isArray(state.customItems)) ? state.customItems.slice() : [];
  var visited = (state && Array.isArray(state.visited)) ? state.visited.slice() : [];
  var plan = (state && Array.isArray(state.plan)) ? state.plan.slice() : [];

  // 1. Apply seed id renames (old -> new) so a rename never drops a mark.
  var applyRename = function (id) {
    return Object.prototype.hasOwnProperty.call(renameMap, id) ? renameMap[id] : id;
  };
  visited = visited.map(applyRename);
  plan = plan.map(applyRename);

  // 2. Merge custom items that now match a seed by normalized key (seed wins);
  //    remap the dropped custom id onto the seed id.
  var seedByKey = {};
  seed.forEach(function (it) { seedByKey[normalizeKey(it.category, it.name)] = it.id; });
  var idRemap = {};
  var keptCustom = [];
  customItems.forEach(function (it) {
    var k = normalizeKey(it.category, it.name);
    if (seedByKey[k]) {
      idRemap[it.id] = seedByKey[k];
    } else {
      keptCustom.push(it);
    }
  });
  var applyRemap = function (id) { return idRemap[id] || id; };
  visited = visited.map(applyRemap);
  plan = plan.map(applyRemap);

  // 3. Drop orphans: ids that match no live item (seed ∪ kept custom).
  var liveIds = {};
  seed.forEach(function (it) { liveIds[it.id] = true; });
  keptCustom.forEach(function (it) { liveIds[it.id] = true; });
  visited = visited.filter(function (id) { return liveIds[id]; });
  plan = plan.filter(function (id) { return liveIds[id]; });

  // 4. De-dup: visited as a set; plan keeps first occurrence (preserve order).
  visited = Array.from(new Set(visited));
  var seen = {};
  plan = plan.filter(function (id) {
    if (seen[id]) return false;
    seen[id] = true;
    return true;
  });

  return { schemaVersion: CURRENT_SCHEMA, visited: visited, plan: plan, customItems: keptCustom };
}

// Name-only normalization (no category prefix) for enricher KB lookups.
function normName(name) {
  return String(name)
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Keyword fallback when a place isn't in the KB. Returns partial attributes or
// null. Order matters: first match wins.
function enrichHeuristic(low) {
  if (/\bpark\b|garden|waterfront|promenade|greenway/.test(low)) {
    return { category: 'parks', budget: 'free', time: 'half', moods: ['outdoorsy', 'chill'] };
  }
  if (/museum|gallery|exhibit/.test(low)) {
    return { category: 'museums', budget: '$$', time: 'half', moods: ['artsy'] };
  }
  if (/pizza|deli|bar|restaurant|taqueria|cafe|coffee|bakery|diner|eatery/.test(low)) {
    return { category: 'food', budget: '$$', time: 'quick', moods: ['foodie'] };
  }
  if (/theater|theatre|broadway|club|comedy|jazz|concert|lounge/.test(low)) {
    return { category: 'shows', budget: '$$$', time: 'half', moods: ['lively'] };
  }
  return null;
}

// Suggest a categorization for a place name, fully offline. The single seam a
// live LLM/search lookup replaces in Phase C. Never throws on unknown input.
function enrich(name, kb) {
  kb = kb || KB;
  var nn = normName(name);
  var hit = null;
  if (kb[nn]) {
    hit = kb[nn];
  } else {
    for (var key in kb) {
      if (!Object.prototype.hasOwnProperty.call(kb, key)) continue;
      var aliases = kb[key].aliases || [];
      for (var i = 0; i < aliases.length; i++) {
        if (normName(aliases[i]) === nn) { hit = kb[key]; break; }
      }
      if (hit) break;
    }
  }
  if (hit) {
    return {
      category: hit.category,
      area: hit.area || '',
      budget: hit.budget || '$$',
      moods: Array.isArray(hit.moods) ? hit.moods.slice() : (hit.moods ? [hit.moods] : []),
      time: hit.time || 'half',
      source: 'kb',
    };
  }
  var h = enrichHeuristic(nn);
  if (h) {
    return { category: h.category, area: '', budget: h.budget, moods: h.moods.slice(), time: h.time, source: 'heuristic' };
  }
  return { category: 'hidden', area: '', budget: '$$', moods: ['chill'], time: 'half', source: 'default' };
}

// Narrow items by any combination of mood/budget/area/time. An absent field is
// no constraint; mood matches if the item's moods array includes it. AND logic.
function applyFilters(items, filters) {
  filters = filters || {};
  return (items || []).filter(function (it) {
    if (filters.mood && !(Array.isArray(it.moods) && it.moods.indexOf(filters.mood) !== -1)) return false;
    if (filters.budget && it.budget !== filters.budget) return false;
    if (filters.area && it.area !== filters.area) return false;
    if (filters.time && it.time !== filters.time) return false;
    return true;
  });
}

// One random item from the filtered set, or null when nothing matches. rng is
// injectable for deterministic tests.
function pickSurprise(items, filters, rng) {
  rng = rng || Math.random;
  var pool = applyFilters(items, filters);
  if (!pool.length) return null;
  return pool[Math.floor(rng() * pool.length)];
}

  (catalog || []).forEach(function (it) { ids[it.id] = true; });
  var count = (visited || []).filter(function (id) { return ids[id]; }).length;
  return { count: count, total: (catalog || []).length };
}

// Sorted unique non-empty area values across the live catalog.
function deriveAreas(catalog) {
  var set = {};
  (catalog || []).forEach(function (it) { if (it.area) set[it.area] = true; });
  return Object.keys(set).sort();
}

// Acquire a storage provider defensively: in browsers that block site data or
// in a sandboxed iframe, even *reading* window.localStorage throws SecurityError.
// Returns the provider or null (makeStore treats null as unavailable).
function safeStorage(win) {
  try {
    if (win && win.localStorage) return win.localStorage;
  } catch (e) {
    return null;
  }
  return null;
}

// Persistence wrapper over an injected storage provider ({getItem,setItem}).
// All access is guarded: if storage is unavailable (private mode) or throws
// (quota), it degrades to an in-memory session and flips `available` to false
// so the UI can warn the user instead of silently losing marks.
function makeStore(storage, key) {
  key = key || 'nyc-todo:v1';
  var available = true;
  var mem = null;
  function freshState() {
    return { schemaVersion: CURRENT_SCHEMA, visited: [], plan: [], customItems: [] };
  }
  function save(state) {
    mem = state;
    try {
      storage.setItem(key, JSON.stringify(state));
    } catch (e) {
      available = false;
    }
  }
  function load(seed, renameMap) {
    var raw = null;
    try {
      raw = storage.getItem(key);
    } catch (e) {
      available = false;
    }
    var state;
    if (raw) {
      try { state = JSON.parse(raw); } catch (e) { state = freshState(); }
    } else {
      state = mem || freshState();
    }
    var clean = reconcile(state, seed, renameMap);
    save(clean);
    return clean;
  }
  return {
    load: load,
    save: save,
    get available() { return available; },
  };
}
/* ==LOGIC-END== */

/* ==UI-START== */
// DOM wiring — runs only in the browser. All user-entered text is placed via
// textContent / createTextNode, never innerHTML, to prevent self-XSS.
(function () {
  if (typeof document === 'undefined') return;

  var CAT_META = {
    iconic: { label: 'Iconic NYC', emoji: '🗽', color: '#FFD60A' },
    museums: { label: 'Museums & Culture', emoji: '🎨', color: '#FFB4A2' },
    parks: { label: 'Parks & Outdoors', emoji: '🌳', color: '#A7E8BD' },
    food: { label: 'Food & Drink', emoji: '🍕', color: '#FFC9A0' },
    neighborhoods: { label: 'Neighborhoods', emoji: '🏙️', color: '#BDE0FE' },
    shows: { label: 'Shows & Nightlife', emoji: '🎭', color: '#E0BBE4' },
    hidden: { label: 'Hidden Gems', emoji: '💎', color: '#FDE68A' },
    free: { label: 'Free & Cheap', emoji: '🆓', color: '#C7F9CC' },
  };
  var CAT_ORDER = ['iconic', 'museums', 'parks', 'food', 'neighborhoods', 'shows', 'hidden', 'free'];
  var BUDGETS = ['free', '$', '$$', '$$$'];
  var BUDGET_LABEL = { free: 'Free', '$': '$', '$$': '$$', '$$$': '$$$' };
  var TIMES = [['quick', 'Under 1 hr'], ['half', 'Half day'], ['full', 'Full day']];
  var TIME_LABEL = { quick: '⏱ <1 hr', half: '⏱ Half day', full: '⏱ Full day' };
  var MOODS = ['chill', 'adventurous', 'romantic', 'foodie', 'artsy', 'touristy', 'outdoorsy', 'lively'];

  var store = makeStore(safeStorage(window));
  var state = store.load(SEED);
  var filters = { mood: '', budget: '', area: '', time: '' };
  var tab = 'browse';
  var root = document.getElementById('app');

  // --- helpers ---
  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) {
      for (var k in props) {
        if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
        if (k === 'text') e.textContent = props[k];
        else if (k === 'class') e.className = props[k];
        else if (k.slice(0, 2) === 'on' && typeof props[k] === 'function') e[k.toLowerCase()] = props[k];
        else e.setAttribute(k, props[k]);
      }
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function pill(text) { return el('span', { class: 'pill', text: text }); }
  function catalog() { return SEED.concat(state.customItems); }
  function byId(id) { var c = catalog(); for (var i = 0; i < c.length; i++) if (c[i].id === id) return c[i]; return null; }
  function isVisited(id) { return state.visited.indexOf(id) !== -1; }
  function inPlan(id) { return state.plan.indexOf(id) !== -1; }
  function persist() { store.save(state); }
  function activeFilters() {
    var f = {};
    if (filters.mood) f.mood = filters.mood;
    if (filters.budget) f.budget = filters.budget;
    if (filters.area) f.area = filters.area;
    if (filters.time) f.time = filters.time;
    return f;
  }

  function toggleVisited(id) {
    var i = state.visited.indexOf(id);
    if (i === -1) state.visited.push(id); else state.visited.splice(i, 1);
    persist(); render();
  }
  function togglePlan(id) {
    var i = state.plan.indexOf(id);
    if (i === -1) state.plan.push(id); else state.plan.splice(i, 1);
    persist(); render();
  }
  function movePlan(id, dir) {
    var i = state.plan.indexOf(id); if (i === -1) return;
    var j = i + dir; if (j < 0 || j >= state.plan.length) return;
    var t = state.plan[i]; state.plan[i] = state.plan[j]; state.plan[j] = t;
    persist(); render();
  }

  // --- card ---
  function card(item, popped) {
    var meta = CAT_META[item.category] || { label: item.category, emoji: '📍', color: '#eee' };
    var c = el('div', { class: 'card' + (isVisited(item.id) ? ' visited' : '') + (popped ? ' pop' : '') });
    var badge = el('span', { class: 'cat-badge', text: meta.emoji + ' ' + meta.label });
    badge.style.background = meta.color;
    c.appendChild(badge);
    c.appendChild(el('h3', { text: item.name }));
    var m = el('div', { class: 'meta' });
    m.appendChild(pill(BUDGET_LABEL[item.budget] || item.budget));
    if (item.area) m.appendChild(pill('📍 ' + item.area));
    m.appendChild(pill(TIME_LABEL[item.time] || item.time));
    if (item.custom) m.appendChild(pill('⭐ yours'));
    c.appendChild(m);
    if (item.blurb) c.appendChild(el('div', { class: 'blurb', text: item.blurb }));
    var actions = el('div', { class: 'actions' });
    var vb = el('button', {
      class: 'visit-btn' + (isVisited(item.id) ? ' on' : ''),
      'aria-pressed': isVisited(item.id) ? 'true' : 'false',
      text: isVisited(item.id) ? '✓ Visited' : 'Mark visited',
      onClick: function () { toggleVisited(item.id); },
    });
    var pb = el('button', {
      text: inPlan(item.id) ? '– Remove' : '＋ Plan',
      onClick: function () { togglePlan(item.id); },
    });
    actions.appendChild(vb); actions.appendChild(pb);
    c.appendChild(actions);
    return c;
  }

  // --- header ---
  function header() {
    var h = el('header', { class: 'app' });
    var bar = el('div', { class: 'bar' });
    bar.appendChild(el('h1', { class: 'title' }, ['🗽 Things to Do in NYC', el('span', { class: 'sub', text: '+ Jersey City' })]));
    bar.appendChild(el('div', { class: 'spacer' }));
    var tabs = el('div', { class: 'tabs', role: 'tablist' });
    tabs.appendChild(el('button', { class: 'tab', role: 'tab', 'aria-selected': tab === 'browse' ? 'true' : 'false', text: 'Browse', onClick: function () { tab = 'browse'; render(); } }));
    var planLabel = 'Plan' + (state.plan.length ? ' (' + state.plan.length + ')' : '');
    tabs.appendChild(el('button', { class: 'tab', role: 'tab', 'aria-selected': tab === 'plan' ? 'true' : 'false', text: planLabel, onClick: function () { tab = 'plan'; render(); } }));
    bar.appendChild(tabs);
    bar.appendChild(el('button', { class: 'btn-dice', 'aria-label': 'Surprise me', text: '🎲 Surprise', onClick: surprise }));
    bar.appendChild(el('button', { class: 'btn-primary', text: '＋ Add', onClick: openAddForm }));
    h.appendChild(bar);
    return h;
  }

  // --- browse ---
  function filterBar() {
    var bar = el('div', { class: 'filters' });
    function sel(labelText, key, opts) {
      var options = [el('option', { value: '', text: 'Any' })];
      opts.forEach(function (o) {
        var val = Array.isArray(o) ? o[0] : o;
        var txt = Array.isArray(o) ? o[1] : o;
        options.push(el('option', { value: val, text: txt }));
      });
      var s = el('select', { onChange: function (e) { filters[key] = e.target.value; render(); } }, options);
      s.value = filters[key];
      return el('label', {}, [labelText, s]);
    }
    bar.appendChild(sel('Mood', 'mood', MOODS));
    bar.appendChild(sel('Budget', 'budget', BUDGETS.map(function (b) { return [b, BUDGET_LABEL[b]]; })));
    bar.appendChild(sel('Area', 'area', deriveAreas(catalog())));
    bar.appendChild(sel('Time', 'time', TIMES));
    if (filters.mood || filters.budget || filters.area || filters.time) {
      bar.appendChild(el('button', { text: 'Clear filters', onClick: function () { filters = { mood: '', budget: '', area: '', time: '' }; render(); } }));
    }
    return bar;
  }

  function browseView() {
    var wrap = el('div');
    var p = progress(state.visited, catalog());
    var prog = el('div', { class: 'progress' });
    prog.appendChild(el('span', { class: 'count', text: 'You’ve visited ' + p.count + ' spots 🎉' }));
    prog.appendChild(el('span', { class: 'sub', text: p.count + ' of ' + p.total }));
    wrap.appendChild(prog);
    wrap.appendChild(filterBar());

    var items = applyFilters(catalog(), activeFilters());
    if (!items.length) {
      wrap.appendChild(el('div', { class: 'empty' }, [
        'No spots match those filters 🙅',
        el('button', { class: 'btn-primary', text: 'Clear filters', onClick: function () { filters = { mood: '', budget: '', area: '', time: '' }; render(); } }),
      ]));
      return wrap;
    }
    CAT_ORDER.forEach(function (cat) {
      var group = items.filter(function (i) { return i.category === cat; });
      if (!group.length) return;
      var meta = CAT_META[cat];
      var section = el('section', { class: 'cat-group' });
      section.appendChild(el('h2', { text: meta.emoji + ' ' + meta.label }));
      var grid = el('div', { class: 'grid' });
      group.forEach(function (it) { grid.appendChild(card(it)); });
      section.appendChild(grid);
      wrap.appendChild(section);
    });
    return wrap;
  }

  // --- plan ---
  function planView() {
    var wrap = el('div');
    wrap.appendChild(el('h2', { text: '🗓️ My Plan' }));
    if (!state.plan.length) {
      wrap.appendChild(el('div', { class: 'empty' }, [
        'Your plan is empty. Tap “＋ Plan” on any spot to build your day!',
        el('button', { class: 'btn-primary', text: 'Browse spots', onClick: function () { tab = 'browse'; render(); } }),
      ]));
      return wrap;
    }
    var list = el('ul', { class: 'plan-list' });
    state.plan.forEach(function (id, idx) {
      var item = byId(id);
      if (!item) return;
      var meta = CAT_META[item.category] || { emoji: '📍' };
      var li = el('li', { class: 'plan-item' + (isVisited(id) ? ' visited' : '') });
      li.appendChild(el('span', { 'aria-hidden': 'true', text: meta.emoji }));
      var grow = el('div', { class: 'grow' });
      grow.appendChild(el('div', { class: 'nm', text: item.name }));
      grow.appendChild(el('div', { class: 'mt', text: (item.area ? item.area + ' · ' : '') + (BUDGET_LABEL[item.budget] || item.budget) }));
      li.appendChild(grow);
      li.appendChild(el('button', { 'aria-label': 'Move up', text: '↑', onClick: function () { movePlan(id, -1); } }));
      li.appendChild(el('button', { 'aria-label': 'Move down', text: '↓', onClick: function () { movePlan(id, 1); } }));
      li.appendChild(el('button', { class: isVisited(id) ? 'visit-btn on' : 'visit-btn', 'aria-pressed': isVisited(id) ? 'true' : 'false', text: isVisited(id) ? '✓' : 'Visit', onClick: function () { toggleVisited(id); } }));
      li.appendChild(el('button', { 'aria-label': 'Remove from plan', text: '✕', onClick: function () { togglePlan(id); } }));
      list.appendChild(li);
    });
    wrap.appendChild(list);
    return wrap;
  }

  // --- surprise ---
  function surprise() {
    var pick = pickSurprise(catalog(), activeFilters());
    if (!pick) {
      openModal('No match 🎲', [
        el('p', { text: 'Nothing matches your current filters. Clear them and roll again?' }),
      ], [
        el('button', { class: 'btn-primary', text: 'Clear & roll', onClick: function () { filters = { mood: '', budget: '', area: '', time: '' }; closeModal(); surprise(); } }),
        el('button', { text: 'Close', onClick: closeModal }),
      ]);
      return;
    }
    openModal('🎲 Tonight’s pick', [card(pick, true)], [
      el('button', { class: 'btn-primary', text: inPlan(pick.id) ? '– Remove from plan' : '＋ Add to plan', onClick: function () { togglePlan(pick.id); closeModal(); } }),
      el('button', { text: '🎲 Roll again', onClick: function () { closeModal(); surprise(); } }),
      el('button', { text: 'Close', onClick: closeModal }),
    ]);
  }

  // --- add form ---
  function openAddForm() {
    var touched = {};
    var errBox = el('div', { class: 'form-err', 'aria-live': 'polite' });
    errBox.style.display = 'none';

    function row(labelText, control, hint) {
      var kids = [labelText, control];
      if (hint) kids.push(el('span', { class: 'hint', text: hint }));
      return el('div', { class: 'form-row' }, kids);
    }
    var nameInput = el('input', { type: 'text', placeholder: 'e.g. Statue of Liberty', 'aria-label': 'Place name' });
    var catSel = el('select', {}, [el('option', { value: '', text: 'Pick a category…' })].concat(CAT_ORDER.map(function (c) { return el('option', { value: c, text: CAT_META[c].emoji + ' ' + CAT_META[c].label }); })));
    var areas = deriveAreas(catalog());
    var dataListId = 'areas-' + Date.now();
    var areaList = el('datalist', { id: dataListId }, areas.map(function (a) { return el('option', { value: a }); }));
    var areaInput = el('input', { type: 'text', list: dataListId, placeholder: 'Neighborhood or borough', 'aria-label': 'Area' });
    var budgetSel = el('select', {}, BUDGETS.map(function (b) { return el('option', { value: b, text: BUDGET_LABEL[b] }); }));
    var moodSel = el('select', {}, MOODS.map(function (mv) { return el('option', { value: mv, text: mv }); }));
    var timeSel = el('select', {}, TIMES.map(function (t) { return el('option', { value: t[0], text: t[1] }); }));

    [catSel, areaInput, budgetSel, moodSel, timeSel].forEach(function (ctrl) {
      var key = ctrl === catSel ? 'category' : ctrl === areaInput ? 'area' : ctrl === budgetSel ? 'budget' : ctrl === moodSel ? 'mood' : 'time';
      ctrl.addEventListener('input', function () { touched[key] = true; });
      ctrl.addEventListener('change', function () { touched[key] = true; });
    });

    // Suggest attributes from the typed name, filling only untouched fields.
    function suggest() {
      if (!nameInput.value.trim()) return;
      var e = enrich(nameInput.value);
      if (!touched.category && e.category) catSel.value = e.category;
      if (!touched.area && e.area) areaInput.value = e.area;
      if (!touched.budget && e.budget) budgetSel.value = e.budget;
      if (!touched.mood && e.moods && e.moods.length) moodSel.value = e.moods[0];
      if (!touched.time && e.time) timeSel.value = e.time;
    }
    nameInput.addEventListener('blur', suggest);

    function submit() {
      var name = nameInput.value.trim();
      if (!name) { showErr('Please enter a place name.'); return; }
      if (!catSel.value) { showErr('Please pick a category.'); return; }
      var input = {
        name: name, category: catSel.value, area: areaInput.value.trim(),
        budget: budgetSel.value || '$$', mood: moodSel.value || 'chill', time: timeSel.value || 'half',
        emoji: (CAT_META[catSel.value] || {}).emoji || '📍',
      };
      var r = addCustomItem(state.customItems, input, SEED);
      if (!r.ok) { showErr('“' + name + '” is already on the list 👍'); return; }
      state.customItems.push(r.item);
      persist();
      closeModal();
      tab = 'browse';
      filters = { mood: '', budget: '', area: '', time: '' };
      render();
    }
    function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }

    openModal('＋ Add a spot', [
      errBox,
      row('Name', nameInput, 'We’ll suggest the rest from the name — tweak anything.'),
      row('Category', catSel),
      row('Area', areaInput),
      row('Budget', budgetSel),
      row('Mood', moodSel),
      row('Time needed', timeSel),
      areaList,
    ], [
      el('button', { class: 'btn-primary', text: 'Add spot', onClick: submit }),
      el('button', { text: 'Cancel', onClick: closeModal }),
    ]);
    nameInput.focus();
  }

  // --- modal ---
  var overlayEl = null;
  function openModal(titleText, bodyKids, footerBtns) {
    closeModal();
    var modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': titleText });
    modal.appendChild(el('h2', { text: titleText }));
    (bodyKids || []).forEach(function (k) { modal.appendChild(k); });
    if (footerBtns && footerBtns.length) {
      var row = el('div', { class: 'close-row' });
      footerBtns.forEach(function (b) { row.appendChild(b); });
      modal.appendChild(row);
    }
    overlayEl = el('div', { class: 'overlay', onClick: function (e) { if (e.target === overlayEl) closeModal(); } }, [modal]);
    document.body.appendChild(overlayEl);
  }
  function closeModal() { if (overlayEl && overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl); overlayEl = null; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  // --- render ---
  function render() {
    root.textContent = '';
    root.appendChild(header());
    var main = el('main', { class: 'wrap' });
    if (!store.available) {
      main.appendChild(el('div', { class: 'notice', text: '⚠️ Heads up: this browser isn’t saving changes (private mode?), so your marks won’t stick here.' }));
    }
    main.appendChild(tab === 'plan' ? planView() : browseView());
    root.appendChild(main);
  }

  render();
})();
/* ==UI-END== */
</script>
