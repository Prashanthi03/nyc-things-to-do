<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Things to Do in NYC 🗽</title>
<style>
/* ==STYLE-START== */
:root{
  --bg:#FCEEEA; --surface:#FFFAF7; --surface2:#F8DCE6; --ink:#2A1E2E; --muted:#6A4D5E;
  --line:#EFD0D8; --dot:#F2BFCF; --primary:#5E2B8C; --on-primary:#FFF3C4; --accent:#F2C230;
  --header:linear-gradient(100deg,#FBB9A6 0%,#F7AFCB 50%,#D8B4F0 100%); --header-ink:#2A1E2E; --tabs-bg:#FCE4EC;
  --good:#3F7D4E; --danger:#B3261E;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;
  color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px, transparent 1.7px);background-size:24px 24px;-webkit-text-size-adjust:100%;}
.sprinkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.sprinkles span{position:absolute;opacity:.24;user-select:none;}
#app{position:relative;z-index:1;}

/* header */
header.app{position:sticky;top:0;z-index:20;background:var(--header);color:var(--header-ink);
  border-bottom:3px solid var(--primary);box-shadow:0 4px 18px rgba(0,0,0,.08);}
header .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1320px;margin:0 auto;padding:12px 22px;}
.title{margin:0;font-family:var(--serif);font-size:1.8rem;font-weight:800;letter-spacing:-.3px;color:var(--header-ink);}
.spacer{flex:1;}
header .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
header .tabs{display:flex;gap:4px;background:var(--tabs-bg);padding:4px;border-radius:999px;}
header .tab{border:none;background:transparent;color:var(--header-ink);}
header .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.14);}
header .btn-primary{border-color:var(--header-ink);}

/* controls */
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;
  padding:9px 16px;min-height:44px;font-weight:700;transition:transform .08s ease, border-color .15s, background .15s;}
button:hover{border-color:var(--primary);}
button:active{transform:translateY(1px);}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 5px var(--ink);}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--primary);}
.visit-on{background:var(--good);color:#fff;border-color:var(--good);}
.danger{color:var(--danger);border-color:var(--danger);}
select{font:inherit;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface);color:var(--ink);font-weight:600;}

.notice{max-width:1320px;margin:12px auto 0;padding:10px 16px;border-radius:14px;background:#FFE0A3;color:#2B2420;font-weight:700;border:2px solid #E3A72F;}

/* split explorer */
main.split{max-width:1320px;margin:0 auto;padding:22px;display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:22px;
  height:calc(100vh - var(--hdr,72px));}
.pane{background:var(--surface);border:2px solid var(--line);border-radius:24px;box-shadow:0 12px 32px rgba(90,40,40,.10);min-height:0;}
.pane-list{display:flex;flex-direction:column;overflow:hidden;}
.list-top{padding:18px 18px 12px;border-bottom:2px dashed var(--line);}
#index{overflow:auto;flex:1;padding:6px 10px 18px;}
.pane-detail{overflow:auto;}

.progress{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.progress .count{font-family:var(--serif);font-size:1.3rem;font-weight:800;}
.progress .sub{color:var(--muted);font-size:.9rem;font-weight:700;}
.search{width:100%;font:inherit;min-height:48px;border:2px solid var(--line);border-radius:16px;padding:8px 16px;background:var(--bg);color:var(--ink);font-weight:600;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.seg{display:inline-flex;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:3px;}
.seg button{border:none;background:transparent;padding:6px 12px;font-size:.88rem;}
.seg button.on{background:var(--primary);color:var(--on-primary);}
details.filters{margin-top:10px;}
details.filters summary{cursor:pointer;font-weight:800;padding:8px 2px;min-height:44px;display:flex;align-items:center;}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px;}
.filter-grid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:800;color:var(--muted);}
.hintline{font-size:.86rem;color:var(--muted);font-weight:700;margin:8px 6px 2px;}
.hint{font-size:.9rem;color:var(--muted);font-weight:600;margin:4px 0 8px;}
.empty{text-align:center;padding:36px 12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;}

.group-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;border-radius:14px;
  background:var(--surface);padding:10px 8px;margin-top:8px;font-family:var(--serif);font-size:1.12rem;font-weight:800;}
.group-h:hover{background:var(--surface2);}
.group-h .n{margin-left:auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.8rem;background:var(--surface2);border-radius:999px;padding:1px 10px;}
.group-h .caret{display:inline-block;transition:transform .15s;}
.group-h[aria-expanded="false"] .caret{transform:rotate(-90deg);}
.rows{list-style:none;margin:0;padding:0;}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;border-left:4px solid transparent;border-radius:14px;
  background:transparent;padding:8px 10px;min-height:54px;font-weight:600;}
.row:hover{background:var(--surface2);border-color:transparent;border-left-color:var(--line);}
.row[aria-current="true"]{background:var(--surface2);border-left-color:var(--primary);}
.row .em{font-size:1.45rem;width:1.9rem;text-align:center;flex:0 0 auto;}
.row .txt{flex:1;min-width:0;}
.row .nm{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .marks{flex:0 0 auto;display:flex;gap:4px;align-items:center;}
.mark-v{color:#fff;background:var(--good);border-radius:999px;font-size:.72rem;padding:1px 8px;font-weight:800;}
.mini{min-width:44px;padding:4px 8px;border-radius:12px;}

/* detail */
.back{display:none;margin:14px 0 0 18px;}
.detail{padding-bottom:28px;}
.hero{position:relative;overflow:hidden;padding:28px 30px 22px;border-radius:22px 22px 0 0;}
.hero .big{font-size:3.4rem;line-height:1;}
.hero h2{font-family:var(--serif);font-size:2.2rem;line-height:1.15;margin:12px 0 12px;max-width:85%;}
.hero-deco{position:absolute;right:18px;top:10px;font-size:6.5rem;opacity:.16;transform:rotate(12deg);pointer-events:none;}
.badges{display:flex;gap:6px;flex-wrap:wrap;}
.cat-badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.82rem;padding:4px 12px;border-radius:999px;border:1.5px solid;color:var(--ink);}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:18px 30px 0;}
.fact{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px 14px;}
.fact .k{display:block;font-size:.78rem;font-weight:800;color:var(--muted);}
.fact .v{display:block;font-size:1.05rem;font-weight:800;}
.fact .est{display:block;font-size:.74rem;color:var(--muted);font-weight:600;}
.desc{padding:18px 30px 0;margin:0;font-family:var(--serif);font-size:1.18rem;line-height:1.6;}
.vibes{padding:12px 30px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:800;color:var(--muted);}
.vibe{background:var(--surface2);border-radius:999px;padding:3px 12px;color:var(--ink);font-size:.86rem;font-weight:700;}
.d-actions{display:flex;gap:10px;flex-wrap:wrap;padding:22px 30px 0;}
.d-actions button{min-width:170px;}
.more{padding:26px 30px 0;}
.more h3{font-family:var(--serif);margin:0 0 6px;font-size:1.18rem;}
.welcome{padding:60px 32px;text-align:center;}
.welcome .big{font-size:4.2rem;}
.welcome h2{font-family:var(--serif);font-size:1.8rem;margin:8px 0;}

/* plan */
.chip-h{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:1.18rem;margin:6px 0 8px;padding:6px 16px;border-radius:999px;background:var(--surface2);}
.scope-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.scope-row button{flex:1;min-width:100px;}
.scope-row button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}
.plan-layout{max-width:1320px;margin:0 auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;}
.plan-col{padding:20px 22px 26px;}
.col-sub{font-family:var(--serif);font-size:1.15rem;margin:20px 0 0;}
.timeline{list-style:none;margin:12px 0 0;padding:0;}
.stop{background:var(--bg);border:2px solid var(--line);border-radius:18px;}
.stop.open{background:var(--surface);border-color:var(--primary);box-shadow:0 8px 22px rgba(90,40,80,.10);}
.stop-head{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;}
.stop-num{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:3px solid;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:var(--ink);}
.stop-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:none;background:transparent;text-align:left;padding:6px 4px;min-height:52px;border-radius:12px;}
.stop-main:hover{background:var(--surface2);}
.stop-main .em{font-size:1.45rem;flex:0 0 auto;}
.stop-main .txt{flex:1;min-width:0;}
.stop-main .nm{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stop-main .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stop-main .caret{color:var(--muted);flex:0 0 auto;}
.stop-ctrls{display:flex;gap:4px;flex:0 0 auto;}
.stop.visited .stop-main .nm{color:var(--muted);}
.stop-body{padding:4px 18px 16px 56px;}
.stop-desc{margin:10px 0 8px;font-family:var(--serif);font-size:1.08rem;line-height:1.55;}
.vibes-inline{display:flex;gap:6px;flex-wrap:wrap;}
.stop-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.hop{margin:0 0 0 28px;padding:7px 0 7px 18px;border-left:3px dotted var(--primary);font-size:.82rem;font-weight:700;color:var(--muted);}

/* modal + add form */
.overlay{position:fixed;inset:0;background:rgba(30,20,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:var(--surface);border:2px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:520px;width:100%;padding:24px;max-height:90vh;overflow:auto;}
.modal h2{margin-top:0;font-family:var(--serif);}
.modal .close-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.modal .close-row button{flex:1;min-width:120px;}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-weight:800;position:relative;}
.form-row input,.form-row select,.form-row textarea{font:inherit;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);color:var(--ink);}
.form-row textarea{min-height:70px;resize:vertical;}
.form-err{color:var(--danger);font-weight:800;margin-bottom:10px;}
.cat-choices{display:flex;flex-wrap:wrap;gap:6px;}
.cat-choices label{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:999px;padding:6px 11px;font-size:.84rem;cursor:pointer;background:var(--surface);font-weight:700;min-height:44px;}
.cat-choices input{min-height:0;width:auto;margin:0;}
.cat-choices label.on{background:var(--surface2);border-color:var(--primary);}
.ac{list-style:none;margin:4px 0 0;padding:0;border:2px solid var(--line);border-radius:12px;background:var(--surface);
  position:absolute;top:100%;left:0;right:0;z-index:5;max-height:240px;overflow:auto;box-shadow:0 10px 24px rgba(0,0,0,.15);}
.ac li{padding:10px 12px;cursor:pointer;font-weight:700;border-bottom:1px solid var(--line);}
.ac li:hover,.ac li.hl{background:var(--surface2);}
.ac li .ac-sub{font-size:.78rem;color:var(--muted);font-weight:600;}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 12px 10px 20px;
  border-radius:999px;font-weight:700;z-index:60;display:flex;gap:10px;align-items:center;box-shadow:0 10px 28px rgba(0,0,0,.25);}
.pop{animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(.94);opacity:0;}60%{transform:scale(1.01);}100%{transform:scale(1);opacity:1;}}

@media (max-width:1000px){
  .stop-head{flex-wrap:wrap;}
  .stop-ctrls{flex-basis:100%;justify-content:flex-end;padding:0 2px 4px 44px;}
  .stop-main .nm{white-space:normal;}
}
@media (max-width:860px){
  .title{font-size:1.35rem;}
  header.app{position:static;}
  header .bar{flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;}
  .spacer{display:none;}
  header .controls{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:2px;min-width:0;max-width:100%;-webkit-overflow-scrolling:touch;}
  header .bar{max-width:100vw;}
  header .controls{scrollbar-width:none;}
  header .controls::-webkit-scrollbar{display:none;}
  header .controls button,header .controls select{flex:0 0 auto;white-space:nowrap;font-size:.88rem;padding:6px 12px;}
  header .tabs{flex:0 0 auto;}
  .facts{grid-template-columns:1fr 1fr;}
  main.split{display:block;height:auto;padding:12px;}
  .pane-list{overflow:visible;}
  #index{overflow:visible;}
  .group-h{top:0;}
  .pane-detail{display:none;}
  main.split.detail-open .pane-list{display:none;}
  main.split.detail-open .pane-detail{display:block;}
  .back{display:inline-flex;}
  .hero{padding:22px 18px 18px;}
  .hero h2{font-size:1.7rem;}
  .facts,.desc,.vibes,.d-actions,.more{padding-left:18px;padding-right:18px;}
  .filter-grid{grid-template-columns:1fr;}
  .plan-layout{grid-template-columns:minmax(0,1fr);padding:12px;gap:14px;}
  .plan-col{padding:16px;}
  .stop-body{padding-left:16px;}
}
@media (prefers-reduced-motion:reduce){ .pop{animation:none;} button,.group-h .caret{transition:none;} }
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
/* ==STYLE-END== */
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==LOGIC-START== */
// Pure, DOM-free logic. The test harness extracts everything between the
// LOGIC markers and runs it under Node. Keep this block free of DOM/window
// references so it loads cleanly outside a browser.

// Canonical match key = normalized NAME (lowercase, strip punctuation, collapse
// whitespace). v2: dedup is by name across categories, since an item can belong
// to several categories.
function normalizeKey(name) {
  return String(name)
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Non-guessable id for user-added items, NEVER derived from the name, so it
// cannot collide with a hand-authored seed slug.
function makeCustomId() {
  const rand = (Math.random().toString(36).slice(2) + '000000').slice(0, 6);
  return 'c_' + Date.now() + '_' + rand;
}

// Looser "same place?" key: also ignores a leading "The".
function looseKey(name) { return normalizeKey(name).replace(/^the /, ''); }

// Every loose key a place answers to: its name plus any aliases.
function placeKeys(it) {
  return [it.name].concat(Array.isArray(it.aliases) ? it.aliases : []).map(looseKey);
}

// Add a user item only if no live place (seed ∪ custom) already answers to its
// name or one of their aliases. moods is always stored as an array.
function addCustomItem(customItems, input, seed) {
  const taken = Object.create(null);
  (seed || []).concat(customItems || []).forEach(function (it) {
    placeKeys(it).forEach(function (k) { taken[k] = true; });
  });
  if (taken[looseKey(input.name)]) return { ok: false, reason: 'duplicate' };
  const moods = Array.isArray(input.moods)
    ? input.moods.slice()
    : (input.mood ? [input.mood] : []);
  const categories = (Array.isArray(input.categories) && input.categories.length)
    ? input.categories.slice()
    : (input.category ? [input.category] : ['hidden']);
  const item = {
    id: makeCustomId(),
    name: String(input.name).trim(),
    categories: categories,
    emoji: input.emoji || '📍',
    area: input.area || '',
    budget: input.budget || '$$',
    moods: moods,
    time: input.time || 'half',
    blurb: input.blurb || '',
    custom: true,
  };
  return { ok: true, item };
}

var CURRENT_SCHEMA = 2;
var CATEGORY_KEYS = ['iconic', 'museums', 'parks', 'food', 'neighborhoods', 'shows', 'hidden', 'free', 'date'];

// v1 stored a single `category` and sometimes a scalar mood; v2 uses arrays.
// Also coerces anything odd in saved data to a shape the UI can render.
function upgradeCustomItem(it) {
  var out = Object.assign({}, it);
  var cats = Array.isArray(out.categories) ? out.categories : (out.category ? [out.category] : []);
  cats = cats.filter(function (c, i) { return CATEGORY_KEYS.indexOf(c) !== -1 && cats.indexOf(c) === i; });
  out.categories = cats.length ? cats : ['hidden'];
  delete out.category;
  var moods = Array.isArray(out.moods) ? out.moods : (out.moods ? [out.moods] : []);
  out.moods = moods.filter(function (m) { return typeof m === 'string'; });
  out.name = String(out.name).trim();
  return out;
}

// Reconcile stored per-person state against the live catalog on every load:
// apply id renames, merge custom items that now match a seed (seed wins, mark
// migrates), drop orphaned ids, and de-dup. Keeps progress and Plan honest.
function reconcile(state, seed, renameMap) {
  renameMap = renameMap || {};
  seed = seed || [];
  var customItems = (state && Array.isArray(state.customItems)) ? state.customItems : [];
  customItems = customItems
    .filter(function (it) { return it && it.id && it.name; })
    .map(upgradeCustomItem);
  var visited = (state && Array.isArray(state.visited)) ? state.visited.slice() : [];
  var plan = (state && Array.isArray(state.plan)) ? state.plan.slice() : [];

  // 1. Apply seed id renames (old -> new) so a rename never drops a mark.
  var applyRename = function (id) {
    return Object.prototype.hasOwnProperty.call(renameMap, id) ? renameMap[id] : id;
  };
  visited = visited.map(applyRename);
  plan = plan.map(applyRename);

  // 2. Merge a custom item into a shown spot with the same NAME (seed wins). Not
  //    by alias: that could silently swallow a user's own "The Park" and its
  //    notes. Also merge custom items sharing a name (v1 allowed one per
  //    category); remap dropped ids so their marks carry over. Maps are
  //    prototype-free so names like "Constructor" can't hit Object keys.
  var seedByKey = Object.create(null);
  seed.forEach(function (it) { seedByKey[looseKey(it.name)] = it.id; });
  var idRemap = Object.create(null);
  var customByKey = Object.create(null);
  var keptCustom = [];
  customItems.forEach(function (it) {
    var k = looseKey(it.name);
    if (seedByKey[k]) { idRemap[it.id] = seedByKey[k]; return; }
    var first = customByKey[k];
    if (first) {
      it.categories.forEach(function (c) { if (first.categories.indexOf(c) === -1) first.categories.push(c); });
      idRemap[it.id] = first.id;
      return;
    }
    customByKey[k] = it;
    keptCustom.push(it);
  });
  var applyRemap = function (id) { return idRemap[id] || id; };
  visited = visited.map(applyRemap);
  plan = plan.map(applyRemap);

  // 3. Drop orphans: ids that match no live item (seed ∪ kept custom).
  var liveIds = Object.create(null);
  seed.forEach(function (it) { liveIds[it.id] = true; });
  keptCustom.forEach(function (it) { liveIds[it.id] = true; });
  visited = visited.filter(function (id) { return liveIds[id]; });
  plan = plan.filter(function (id) { return liveIds[id]; });

  // 4. De-dup: visited as a set; plan keeps first occurrence (preserve order).
  visited = Array.from(new Set(visited));
  var seen = Object.create(null);
  plan = plan.filter(function (id) {
    if (seen[id]) return false;
    seen[id] = true;
    return true;
  });

  return { schemaVersion: CURRENT_SCHEMA, visited: visited, plan: plan, customItems: keptCustom };
}

// Keyword fallback when a place isn't in the library. Returns partial
// attributes (categories[] included) or null. Order matters: first match wins.
function enrichHeuristic(low) {

// Suggest attributes for a place name, fully offline. Looks the name (or an
// alias) up in the library, else keyword heuristics, else safe defaults. Returns
// categories[] + a blurb. The single seam a live LLM/search lookup replaces in
// Phase C. Never throws on unknown input.
function enrich(name, library) {
  library = library || SEED.concat(KB_EXTRA);
  var nn = looseKey(name);
  var hit = null;
  for (var i = 0; i < library.length && !hit; i++) {
    if (placeKeys(library[i]).indexOf(nn) !== -1) hit = library[i];
  }
  if (hit) {
    return {
      categories: Array.isArray(hit.categories) ? hit.categories.slice() : (hit.category ? [hit.category] : ['hidden']),
      area: hit.area || '',
      budget: hit.budget || '$$',
      moods: Array.isArray(hit.moods) ? hit.moods.slice() : (hit.moods ? [hit.moods] : []),
      time: hit.time || 'half',
      blurb: hit.blurb || '',
      source: 'kb',
    };
  }
  var h = enrichHeuristic(nn);
  if (h) {
    return { categories: h.categories.slice(), area: '', budget: h.budget, moods: h.moods.slice(), time: h.time, blurb: '', source: 'heuristic' };
  }
  return { categories: ['hidden'], area: '', budget: '$$', moods: ['chill'], time: 'half', blurb: '', source: 'default' };
}

// Autocomplete: library items whose name or an alias contains the query.
function suggestNames(library, query, limit) {
  limit = limit || 8;
  var q = normalizeKey(query);
  if (!q) return [];
  var out = [];
  for (var i = 0; i < library.length && out.length < limit; i++) {
    var it = library[i];
    var match = normalizeKey(it.name).indexOf(q) !== -1;
    if (!match && it.aliases) {
      for (var j = 0; j < it.aliases.length; j++) {
        if (normalizeKey(it.aliases[j]).indexOf(q) !== -1) { match = true; break; }
      }
    }
    if (match) out.push(it);
  }
  return out;
}

// Free-text search across name, area, and categories.
function searchItems(items, query) {
  var q = normalizeKey(query);
  if (!q) return items.slice();
  return items.filter(function (it) {
    if (normalizeKey(it.name).indexOf(q) !== -1) return true;
    if (it.area && normalizeKey(it.area).indexOf(q) !== -1) return true;
    var cats = it.categories || [];
    for (var i = 0; i < cats.length; i++) if (normalizeKey(cats[i]).indexOf(q) !== -1) return true;
    return false;
  });
}

// Build a suggested itinerary from the user's answers. scope: one|half|full →
// 1/3/5 spots. Applies the mood/budget/area/time filters, shuffles with the
// injected rng, and clusters by area so the day isn't all over the map.
function generatePlan(items, answers, rng) {
  rng = rng || Math.random;
  answers = answers || {};
  var size = answers.scope === 'full' ? 5 : answers.scope === 'half' ? 3 : 1;
  var pool = applyFilters(items, { mood: answers.mood, budget: answers.budget, area: answers.area, time: answers.time });
  if (!pool.length) return [];
  var arr = pool.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  if (size === 1) return [arr[0]];
  var anchor = arr[0];
  var borough = boroughOf(anchor.area);
  var same = arr.filter(function (x) { return x.area === anchor.area; });
  var near = arr.filter(function (x) { return x.area !== anchor.area && boroughOf(x.area) === borough; });
  var rest = arr.filter(function (x) { return boroughOf(x.area) !== borough; });
  return same.concat(near, rest).slice(0, size);
}

      role: 'combobox', 'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': acId,
    });
    var acBox = el('ul', { class: 'ac', id: acId, role: 'listbox', 'aria-label': 'Known places' }); acBox.style.display = 'none';
    var acItems = [];
    var acIndex = -1;
    var dlId = 'areas-' + Date.now();
    var areaList = el('datalist', { id: dlId }, deriveAreas(catalog()).map(function (a) { return el('option', { value: a }); }));
    var areaInput = el('input', { type: 'text', list: dlId, placeholder: 'Neighborhood or borough', 'aria-label': 'Area' });
    var budgetSel = el('select', { 'aria-label': 'Budget' }, BUDGETS.map(function (b) { return el('option', { value: b, text: BUDGET_LABEL[b] }); }));
    var moodSel = el('select', { 'aria-label': 'Mood' }, moodOpts().map(function (o) { return el('option', { value: o[0], text: o[1] }); }));
    var timeSel = el('select', { 'aria-label': 'Time needed' }, TIMES.map(function (t) { return el('option', { value: t[0], text: t[1] }); }));
    var descInput = el('textarea', { placeholder: 'A short description (fills in when we recognize the place).', 'aria-label': 'Description' });

    [[areaInput, 'area'], [budgetSel, 'budget'], [moodSel, 'mood'], [timeSel, 'time'], [descInput, 'desc']].forEach(function (p) {
      p[0].addEventListener('input', function () { touched[p[1]] = true; });
      p[0].addEventListener('change', function () { touched[p[1]] = true; });
    });

    function applyEnrich(e) {
      if (!touched.categories && e.categories && e.categories.length) setCategories(e.categories);
      if (!touched.area && e.area) areaInput.value = e.area;
      if (!touched.budget && e.budget) budgetSel.value = e.budget;
      if (!touched.mood && e.moods && e.moods.length) moodSel.value = e.moods[0];
      if (!touched.time && e.time) timeSel.value = e.time;
      if (!touched.desc && e.blurb) descInput.value = e.blurb;
    }
    function fillFromItem(it) {
      nameInput.value = it.name;
      setCategories(it.categories || []); touched.categories = true;
      areaInput.value = it.area || ''; touched.area = true;
      budgetSel.value = it.budget || '$$'; touched.budget = true;
      moodSel.value = (it.moods && it.moods[0]) || 'chill'; touched.mood = true;
      timeSel.value = it.time || 'half'; touched.time = true;
      descInput.value = it.blurb || ''; touched.desc = true;
      hideAC();
    }
    function hideAC() {
      acBox.style.display = 'none'; acBox.textContent = ''; acItems = []; acIndex = -1;
      nameInput.setAttribute('aria-expanded', 'false'); nameInput.removeAttribute('aria-activedescendant');
    }
    function showAC() {
      acBox.textContent = '';
      acItems = nameInput.value.trim() ? suggestNames(SEED.concat(KB_EXTRA, state.customItems), nameInput.value, 8) : [];
      acIndex = -1;
      if (!acItems.length) { hideAC(); return; }
      acItems.forEach(function (it, i) {
        var li = el('li', { id: acId + '-' + i, role: 'option', 'aria-selected': 'false' }, [el('span', { text: it.name }), el('span', { class: 'ac-sub', text: '  ' + (it.area || '') })]);
        li.addEventListener('mousedown', function (ev) { ev.preventDefault(); fillFromItem(it); });
        acBox.appendChild(li);
      });
      acBox.style.display = 'block';
      nameInput.setAttribute('aria-expanded', 'true');
    }
    function highlight(i) {
      acIndex = i;
      Array.prototype.forEach.call(acBox.children, function (li, j) {
        li.className = j === i ? 'hl' : '';
        li.setAttribute('aria-selected', j === i ? 'true' : 'false');
      });
      nameInput.setAttribute('aria-activedescendant', acId + '-' + i);
      acBox.children[i].scrollIntoView({ block: 'nearest' });
    }
    nameInput.addEventListener('input', showAC);
    nameInput.addEventListener('keydown', function (e) {
      var n = acItems.length;
      if (n && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        highlight(e.key === 'ArrowDown' ? (acIndex + 1) % n : (acIndex - 1 + n) % n);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (acIndex >= 0) fillFromItem(acItems[acIndex]); else submit();
      } else if (e.key === 'Escape' && n) {
        e.stopPropagation();
        hideAC();
      }
    });
    nameInput.addEventListener('blur', function () {
      setTimeout(hideAC, 150);
      if (nameInput.value.trim()) applyEnrich(enrich(nameInput.value));
    });

    function row(labelText, control, hint) { var kids = [labelText, control]; if (hint) kids.push(el('span', { class: 'hint', text: hint })); return el('div', { class: 'form-row' }, kids); }
    function showErr(m) { errBox.textContent = m; errBox.style.display = 'block'; }
    function submit() {
      var name = nameInput.value.trim();
      if (!name) { showErr('Please enter a place name.'); return; }
      var cats = getCategories();
      if (!cats.length) { showErr('Pick at least one category.'); return; }
      var input = {
        name: name, categories: cats, area: areaInput.value.trim(), budget: budgetSel.value || '$$', mood: moodSel.value || 'chill',
        time: timeSel.value || 'half', blurb: descInput.value.trim(), emoji: (CAT_META[cats[0]] || {}).emoji || '📍',
      };
      var r = addCustomItem(state.customItems, input, SEED);
      if (!r.ok) { showErr('“' + name + '” is already on the list 👍'); return; }
      state.customItems.push(r.item);
      persist();
      closeModal();
      tab = 'explore'; searchQuery = ''; filters = emptyFilters();
      selectedId = r.item.id; detailOpen = true; popNext = true;
      render();
      var title = document.getElementById('d-title');
      if (title) title.focus({ preventScroll: true });
      toast('⭐ Added ' + name + '!');
    }

    var nameRow = row('Name', nameInput, 'We’ll suggest the rest — pick a match or type your own.');
    nameRow.appendChild(acBox);
    openModal('＋ Add A Spot', [
      errBox, nameRow,
      row('Categories (Pick 1+)', catChoices),
      row('Area', areaInput),
      row('Budget', budgetSel),
      row('Mood', moodSel),
      row('Time Needed', timeSel),
      row('Description', descInput),
      areaList,
    ], [
      el('button', { class: 'btn-primary', text: 'Add Spot', onClick: submit }),
      el('button', { text: 'Cancel', onClick: closeModal }),
    ], {
      // Don't throw away typed details on a stray tap outside the form.
      canDismiss: function () { return !nameInput.value.trim() && !descInput.value.trim(); },
      onEnter: function (target) { if (target !== nameInput) submit(); },
    });
    nameInput.focus();
  }

  // --- modal ---
  var overlayEl = null;
  var lastFocus = null;
  function openModal(titleText, bodyKids, footerBtns, opts) {
    opts = opts || {};
    closeModal();
    lastFocus = document.activeElement;
    var modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': titleText });
    modal.appendChild(el('h2', { text: titleText }));
    (bodyKids || []).forEach(function (k) { modal.appendChild(k); });
    if (footerBtns && footerBtns.length) modal.appendChild(el('div', { class: 'close-row' }, footerBtns));
    modal.addEventListener('keydown', function (e) {
      var t = e.target;
      if (e.key === 'Enter' && opts.onEnter && (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type !== 'checkbox' && !t.hasAttribute('list')))) {
        e.preventDefault();
        opts.onEnter(t);
      }
    });
    overlayEl = el('div', {
      class: 'overlay',
      onClick: function (e) {
        if (e.target !== overlayEl) return;
        if (!opts.canDismiss || opts.canDismiss()) { closeModal(); return; }
        var first = modal.querySelector('input, select, textarea, button');
        if (first) first.focus();
      },
    }, [modal]);
    document.body.appendChild(overlayEl);
  }
  // Keep Tab inside the open dialog.
  function trapTab(e) {
    var items = Array.prototype.filter.call(
      overlayEl.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])'),
      function (n) { return !n.disabled && n.offsetParent !== null; });
    if (!items.length) return;
    var first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function closeModal() {
    if (!overlayEl) return;
    if (overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl);
    overlayEl = null;
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Tab' && overlayEl) { trapTab(e); return; }
    if (e.key !== 'Escape') return;
    if (overlayEl) closeModal();
    else if (detailOpen && isNarrow()) closeDetail();
  });

  // --- render ---
  function setHeaderHeight() {
    var h = document.querySelector('header.app');
    var n = document.querySelector('.notice');
    var hh = h ? h.offsetHeight : 0;
    document.documentElement.style.setProperty('--hdr', (hh + (n ? n.offsetHeight + 12 : 0)) + 'px');
  }
  window.addEventListener('resize', setHeaderHeight);

  function render() {
    var keep = {};
    ['index'].forEach(function (id) { var n = document.getElementById(id); if (n) keep[id] = n.scrollTop; });
    var fk = focusKey();
    var detailEl = document.getElementById('detail');
    var detailTop = detailEl && renderedId === selectedId ? detailEl.scrollTop : 0;
    // A deleted spot can take the last option for a chosen area with it.
    var areas = deriveAreas(catalog());
    if (filters.area && areas.indexOf(filters.area) === -1) filters.area = '';
    if (planGen.area && areas.indexOf(planGen.area) === -1) planGen.area = '';
    root.textContent = '';
    root.appendChild(header());
    if (!store.available) {
      root.appendChild(el('div', { class: 'notice', role: 'status', text: '⚠️ Heads Up: this browser isn’t saving changes (private mode?), so your marks won’t stick here.' }));
    }
    if (tab === 'plan') {
      root.appendChild(planPage());
    } else {
      var main = el('main', { id: 'split', class: 'split' + (detailOpen ? ' detail-open' : '') });
      main.appendChild(exploreList());
      main.appendChild(detailPane());
      root.appendChild(main);
      renderIndex(true);
    }
    Object.keys(keep).forEach(function (id) { var n = document.getElementById(id); if (n) n.scrollTop = keep[id]; });
    var d = document.getElementById('detail');
    if (d) d.scrollTop = detailTop;
    renderedId = selectedId;
    restoreFocus(fk);
    setHeaderHeight();
  }

  // Open on a random unvisited highlight so the detail pane isn't empty on desktop.
  var spotlight = pickSurprise(unvisited().filter(function (i) { return i.featured; }), {});
  if (spotlight) selectedId = spotlight.id;
  applyTheme();
  render();
})();
/* ==UI-END== */
</script>
</body>
</html>
